[package]
name = "rpf9-convert"
version = "0.1.0"
edition.workspace = true
license = "Unlicense"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["bmp", "dds", "jpeg", "png", "tga", "webp"] }
rpf9-core = { path = "../rpf9-core" }
serde_json = "1"
tempfile = "3"
texture2ddecoder = "0.1.2"
